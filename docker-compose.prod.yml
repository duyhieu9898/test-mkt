services:
  # =========================================================
  # PostgreSQL
  # =========================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: 1person-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-oneperson}

    volumes:
      - /srv/storage/1person/postgres:/var/lib/postgresql/data

    mem_limit: 2g
    cpus: 2

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-oneperson}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - 1person-network

  # =========================================================
  # Redis
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: 1person-redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes"
      ]

    volumes:
      - /srv/storage/1person/redis:/data

    mem_limit: 512m
    cpus: 0.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    networks:
      - 1person-network

  # =========================================================
  # Database Migration
  # =========================================================
  migrate:
    image: 1person-api-migrator:${IMAGE_TAG}
    container_name: 1person-migrate
    restart: "no"

    profiles:
      - tools

    env_file:
      - .env.production

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - 1person-network

  # =========================================================
  # API Backend
  # =========================================================
  api:
    image: 1person-api:${IMAGE_TAG}
    container_name: 1person-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT}

    ports:
      - "${BIND_IP}:${API_PORT}:${API_PORT}"

    mem_limit: 2g
    cpus: 2

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8004/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - 1person-network

  # =========================================================
  # Next.js Web Frontend
  # =========================================================
  web:
    image: 1person-web:${IMAGE_TAG}
    container_name: 1person-web
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: 3000

    ports:
      - "${BIND_IP}:${WEB_PORT}:3000"

    mem_limit: 1g
    cpus: 1

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - 1person-network

networks:
  1person-network:
    driver: bridge
